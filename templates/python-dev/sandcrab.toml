[template]
name = "python-dev"
version = "0.1.0"
description = "Python 3.15 + uv + ruff + pytest + mypy development sandbox for AI coding agents"
image = "sandcrab/python-dev:0.1.0"
# Pins the locally built image ID (docker image inspect --format {{.Id}}); not
# reproducible across rebuilds yet. Refresh with: templates/build.sh --pin
sha256 = "sha256:2b652e5ef776adca824ab33ce5b347ddc1b3ef0ca033dc58c3eea0e6947c2acd"

[resources]
vcpu = 2
memory_mb = 1024
disk_mb = 4096

[workspace]
workdir = "/workspace"

[network]
default_policy = "disabled"

[tools]
tiers = ["core", "process"]
