[template]
name = "python-dev"
version = "0.1.0"
description = "Python 3.15 + uv + ruff + pytest + mypy development sandbox for AI coding agents"
image = "sandcrab/python-dev:0.1.0"

[resources]
vcpu = 2
memory_mb = 1024
disk_mb = 4096

[workspace]
workdir = "/workspace"

[network]
default_policy = "egress_restricted"

[tools]
tiers = ["core", "process"]
