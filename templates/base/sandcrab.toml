[template]
name = "base"
version = "0.1.0"
description = "Minimal Debian 13 (trixie-slim) base image with core CLI utilities; crabd is injected at runtime"
image = "sandcrab/base:0.1.0"
# Pins the locally built image ID (docker image inspect --format {{.Id}}); not
# reproducible across rebuilds yet. Refresh with: templates/build.sh --pin
sha256 = "sha256:5dcb2f18b8a807cd3aa9f7db5abaa9fd89d06c65b2348d66e0153fd831ef0b5d"
sha256_by_arch = { amd64 = "sha256:5dcb2f18b8a807cd3aa9f7db5abaa9fd89d06c65b2348d66e0153fd831ef0b5d", arm64 = "sha256:a4aed41dc0a9e74457cb563d7800d0d2c002ddd97281ce105fedd1e9dc348114" }

[resources]
vcpu = 1
memory_mb = 512
disk_mb = 2048

[workspace]
workdir = "/workspace"

[network]
default_policy = "disabled"

[tools]
tiers = ["core", "process"]
