[template]
name = "base"
version = "0.1.0"
description = "Minimal Debian 13 (trixie-slim) base image with core CLI utilities; crabd is injected at runtime"
image = "sandcrab/base:0.1.0"
# The built image ID is pinned per host, not here (local image IDs do not reproduce
# across hosts): `templates/build.sh base` records it under ~/.sandcrab/template-pins.
# The Dockerfile FROM base images are digest-pinned.

[resources]
vcpu = 1
memory_mb = 512
disk_mb = 2048

[workspace]
workdir = "/workspace"

[network]
default_policy = "disabled"

[tools]
tiers = ["core", "process"]
