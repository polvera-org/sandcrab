[template]
name = "render"
version = "0.1.0"
description = "Headless Chromium, Playwright, ffmpeg, ImageMagick, and Typst rendering sandbox"
image = "sandcrab/render:0.1.0"
# The built image ID is pinned per host, not here (local image IDs do not reproduce
# across hosts): `templates/build.sh render` records it under ~/.sandcrab/template-pins.
# The Dockerfile FROM base images are digest-pinned.

[resources]
vcpu = 2
memory_mb = 2048
disk_mb = 6144

[workspace]
workdir = "/workspace"

[network]
default_policy = "disabled"

[tools]
tiers = ["core", "process", "browser"]
