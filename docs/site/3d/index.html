<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandcrab 3D Kit</title>
<meta name="description" content="Gallery of the shared three.js Sandcrab scenes: crab, jar, tide pool, burrow, molting, one wire, toolbelt.">
<style>
:root {
  --bg:#F8F2E6; --surface:#FFFCF6; --surface-2:#F5ECD9; --ink:#0B2F38; --ink-2:#3C5A62; --line:#E2D3B4;
  --accent:#D9472A; --teal:#1F7A8C; --stage:#F5ECD9;
  --shadow:0 1px 2px rgba(11,47,56,.06),0 8px 24px rgba(11,47,56,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0A1B20; --surface:#10262D; --surface-2:#163239; --ink:#E9F1EF; --ink-2:#A9BFC0; --line:#21414A;
    --accent:#FF8466; --teal:#5FB7C7; --stage:#0E2329; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0A1B20; --surface:#10262D; --surface-2:#163239; --ink:#E9F1EF; --ink-2:#A9BFC0; --line:#21414A;
  --accent:#FF8466; --teal:#5FB7C7; --stage:#0E2329; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px; }
h1,h2 { font-family:"Space Grotesk", Inter, system-ui, sans-serif; letter-spacing:-.01em; line-height:1.15; margin:0; }
code { white-space:nowrap; font:12.5px/1.4 "JetBrains Mono", ui-monospace, Menlo, monospace; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--ink); }
.top { display:flex; justify-content:space-between; align-items:center; padding:20px 0; }
.brand { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:18px; }
.btn { font:500 14px/1 Inter, system-ui, sans-serif; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer; }
.btn:hover { border-color:var(--teal); }
.btn[aria-pressed="true"] { background:var(--ink); color:var(--surface); border-color:var(--ink); }
.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.intro { padding:20px 0 28px; max-width:760px; }
.intro h1 { font-size:clamp(30px,5vw,48px); }
.intro p { color:var(--ink-2); font-size:17px; margin:12px 0 0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr)); gap:24px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; }
.stage { aspect-ratio:4/3; background:var(--stage); position:relative; }
.body { padding:16px 20px 20px; display:flex; flex-direction:column; gap:8px; }
.body h2 { font-size:22px; }
.eyebrow { margin:0; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
.body p { margin:0; color:var(--ink-2); }
.only .grid { grid-template-columns:1fr; }
.only .stage { aspect-ratio:16/9; }
footer { border-top:1px solid var(--line); color:var(--ink-2); font-size:14px; padding:24px 0 48px; margin-top:48px; }

/* dev tuning panel (?tune) */
.tune { position:fixed; right:16px; bottom:16px; width:min(320px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px; z-index:10; font-size:13px; }
.tune h3 { margin:0 0 8px; font:600 13px/1.2 "JetBrains Mono", ui-monospace, monospace; text-transform:uppercase; letter-spacing:.08em; }
.tune .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.tune .chips .btn { padding:6px 10px; font-size:12px; }
.tune label { display:grid; grid-template-columns:72px 1fr 44px; align-items:center; gap:8px; margin:6px 0; color:var(--ink-2); }
.tune output { font:12px "JetBrains Mono", ui-monospace, monospace; color:var(--ink); text-align:right; }
.tune .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tune .row .btn { padding:7px 10px; font-size:12px; }
.tune .stat { color:var(--ink-2); font:12px "JetBrains Mono", ui-monospace, monospace; margin-top:8px; }
.tune input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:4px; background:var(--line); outline:none; }
.tune input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--teal); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--teal); cursor:pointer; }
.tune input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--teal); border:2px solid var(--surface); cursor:pointer; }
.tune input[type=range]:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
@media (max-width:560px) { .body { padding:14px 16px 16px; } .intro p { font-size:16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Sandcrab</div>
    <div role="group" aria-label="Theme" style="display:flex;gap:6px">
      <button class="btn" data-theme-set="auto">Auto</button>
      <button class="btn" data-theme-set="light">Light</button>
      <button class="btn" data-theme-set="dark">Dark</button>
    </div>
  </header>
  <section class="intro">
    <h1>Sandcrab 3D kit</h1>
    <p>Seven small three.js scenes, one idea each. Procedural, offline, under 5k triangles apiece. Mount any of them with <code>mount(el, 'jar')</code>; add <code>?tune</code> to this URL for the tuning panel.</p>
  </section>
  <main class="grid" id="grid"></main>
  <footer>three.js r186 vendored under <code>vendor/</code>. API: <code>README.md</code>. Art direction: <code>../symbology.html</code>.</footer>
</div>

<script type="module">
import { mount, SCENES } from './src/index.js';

const COPY = {
  crab:     ['Mascot', 'The Sandcrab crab, articulated and idling. Poses: idle, wave, work.'],
  jar:      ['Hardware isolation', 'Every crab gets its own sealed jar: one microVM, one kernel.'],
  tidepool: ['Shared kernel (Docker)', 'Containers share one pool. Entering it is a deliberate choice.'],
  burrow:   ['Persistent workspace', 'Sandboxes come and go; the workspace and its files stay.'],
  molt:     ['Ephemeral sandbox', 'The sandbox is discarded; the output survives.'],
  wire:     ['One guest protocol', 'One wire, one protocol, on every backend.'],
  toolbelt: ['Native tools', 'A small, sharp toolset in the claws, one tool at a time.'],
};

const q = new URLSearchParams(location.search);
const only = q.get('only');
const seekT = q.has('t') ? Number(q.get('t')) : null;
const TUNE = q.has('tune');
const KEY = 'sandcrab-3d-tune';

// theme switcher: data-theme on <html>, scenes follow automatically
const themeBtns = document.querySelectorAll('[data-theme-set]');
function setTheme(v) {
  if (v === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
  themeBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === v)));
  try { localStorage.setItem('sandcrab-theme', v); } catch {}
}
let savedTheme = q.get('theme');
if (!savedTheme) { try { savedTheme = localStorage.getItem('sandcrab-theme'); } catch {} }
setTheme(savedTheme || 'auto');
themeBtns.forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));

let saved = { global: {}, scenes: {} };
if (TUNE) { try { saved = { ...saved, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch {} }

const grid = document.getElementById('grid');
const stages = {};
const names = only && SCENES[only] ? [only] : Object.keys(SCENES);
if (only) document.body.classList.add('only');
for (const name of names) {
  const [eyebrow, text] = COPY[name];
  const card = document.createElement('article');
  card.className = 'card';
  card.id = name;
  card.innerHTML = `<div class="stage"></div><div class="body"><p class="eyebrow">${eyebrow}</p><h2>${SCENES[name].meta.title}</h2><p>${text}</p><p><code>mount(el, '${name}')</code></p></div>`;
  grid.appendChild(card);
  const params = { ...(saved.global || {}), ...((saved.scenes || {})[name] || {}) };
  stages[name] = mount(card.querySelector('.stage'), name, { params, t0: seekT ?? 0 });
  if (seekT !== null) { stages[name].pause(); stages[name].seek(seekT); }
}
window.__stages = stages;

if (TUNE) buildPanel();

function buildPanel() {
  const GLOBAL = ['speed', 'outline', 'maxDpr'];
  const SPEC = [
    ['speed', 0, 2, 0.05], ['yaw', -1.6, 1.6, 0.01], ['pitch', 0.1, 1.2, 0.01], ['fraction', 0.3, 0.95, 0.01],
    ['sway', 0, 0.3, 0.01], ['outline', 0, 4, 0.1], ['shadow', 0, 0.6, 0.01], ['maxDpr', 1, 3, 0.25],
  ];
  let current = names[0];
  const panel = document.createElement('aside');
  panel.className = 'tune';
  panel.innerHTML = `<h3>Tune</h3><div class="chips"></div><div class="sliders"></div>
    <div class="row"><button class="btn" data-act="pause">Pause (space)</button><button class="btn" data-act="copy">Copy params</button><button class="btn" data-act="reset">Reset</button></div>
    <div class="stat"></div>`;
  document.body.appendChild(panel);
  const chips = panel.querySelector('.chips');
  const sliders = panel.querySelector('.sliders');
  const stat = panel.querySelector('.stat');
  const eff = (st, key) => st.params[key] ?? st.meta.view[key] ?? (key === 'shadow' ? 0.14 : 0);
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} }
  function renderSliders() {
    const st = stages[current];
    sliders.innerHTML = '';
    for (const [key, min, max, step] of SPEC) {
      const lab = document.createElement('label');
      const v = eff(st, key);
      lab.innerHTML = `<span>${key}${GLOBAL.includes(key) ? '*' : ''}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${v}"><output>${(+v).toFixed(2)}</output>`;
      const input = lab.querySelector('input');
      input.addEventListener('input', () => {
        const val = Number(input.value);
        lab.querySelector('output').textContent = val.toFixed(2);
        if (GLOBAL.includes(key)) { saved.global[key] = val; Object.values(stages).forEach((s) => s.set({ [key]: val })); }
        else { (saved.scenes[current] ||= {})[key] = val; st.set({ [key]: val }); }
        persist();
      });
      sliders.appendChild(lab);
    }
  }
  for (const n of names) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = n;
    b.addEventListener('click', () => { current = n; chips.querySelectorAll('.btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderSliders(); });
    b.setAttribute('aria-pressed', String(n === current));
    chips.appendChild(b);
  }
  const togglePause = () => Object.values(stages).forEach((s) => (s.params.paused ? s.play() : s.pause()));
  panel.addEventListener('click', async (e) => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === 'pause') togglePause();
    if (act === 'copy') { try { await navigator.clipboard.writeText(JSON.stringify(saved, null, 2)); e.target.textContent = 'Copied'; setTimeout(() => (e.target.textContent = 'Copy params'), 1200); } catch {} }
    if (act === 'reset') { saved = { global: {}, scenes: {} }; persist(); location.reload(); }
  });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    const n = Number(e.key);
    if (n >= 1 && n <= 9) {
      for (const s of Object.values(stages)) {
        let a = 0; const ph = s.meta.phases || [];
        if (n - 1 < ph.length) { for (let i = 0; i < n - 1; i++) a += ph[i].d; s.seek(a); }
      }
    }
  });
  renderSliders();
  setInterval(() => {
    const s = stages[current];
    const u = ((s.time % s.meta.loop) + s.meta.loop) % s.meta.loop;
    let a = 0, ph = '';
    for (const p of s.meta.phases) { if (u < a + p.d) { ph = p.name; break; } a += p.d; }
    stat.textContent = `${current} · t ${u.toFixed(1)}/${s.meta.loop}s · ${ph} · ${s.info().triangles} tris`;
  }, 250);
}
</script>
</body>
</html>
