# ministack execution flow: sdk-milestone
# Validate with: node <ministack>/scripts/validate-flow.mjs docs/plans/sdk-milestone.flow.yaml

slug: sdk-milestone
name: "Server, TypeScript SDK and socket forwards"
summary: >-
  Make Sandcrab usable from a non-Rust application that has no backend access of its own: a host daemon
  (`sandcrab-server`) on a Unix socket (JSON-RPC 2.0 control, raw byte streams beside it), a TypeScript SDK that talks to it, and the generic
  primitives a first adopter needs to put Sandcrab behind its own process-launcher interface (spawn, exec, sweep,
  reap, capabilities): argv exec with an exact env, byte streams both ways, tree kill with grace, per-process
  limits, folders mounted at the same absolute path, forwards from a sandbox with no network back to endpoints the
  client names, labels that survive a client restart, and a self-test that earns the isolation claim. Docker and libkrun only. The adopter keeps its own
  egress proxy and reaches it through a forward; Sandcrab's own egress proxy stays Phase 3.
phases: [plan, implement, verify, document]

steps:
  # ---------------------------------------------------------------- plan
  - id: contract-research
    phase: plan
    agent: nova
    title: "Derive the adopter contract: first from its code, then from its launcher spec and the interface as built on its refactor branch (spawn / exec / sweep / reap / capabilities, nine invariants, a conformance suite). Private notes only (docs/private/, gitignored)"
    depends_on: []
    status: done

  - id: design
    phase: plan
    agent: turing
    title: "Design doc + ADR 0002, with a table mapping every field and invariant of the adopter's launcher interface to a Sandcrab primitive: the server API as JSON-RPC 2.0 on a Unix socket with raw byte streams beside it for process I/O and forwards (decided; the design fixes the framing and how a stream is attached), access by socket mode and peer uid with no token (decided), protocol 0.3, forwards that end at the client (a loopback port or a Unix socket the client names), same-path mounts with allowed roots and a path map, sandbox reuse for many short execs, labels and orphan listing across client and server restarts, the self-test lines, bring-your-own-image templates. Lists the contract points only the adopter can settle"
    depends_on: [contract-research]
    artifacts: [docs/design/server-and-sdk.md, docs/decisions/0002-server-and-sdk.md]
    status: doing

  - id: adopter-flow
    phase: plan
    agent: nova
    title: "Author the adopter-side flow in the adopter's own repository, after its launcher refactor has merged: a Sandcrab-backed launcher wrapped around its local one (host identity stays local), sandbox pooling per run, its open contract points (see the plan), the transition switch, then deletion of its privilege-drop, uid-pool, netns and firewall machinery. Not tracked in this repo"
    depends_on: [design]
    status: todo

  # ----------------------------------------------------------- implement
  - id: protocol-03
    phase: implement
    agent: ada
    title: "sandcrab-protocol 0.3: `exec` and `process_start` with argv, exact env, cwd, per-process limits (nproc, data, fsize, nofile), stderr `tail` or `merge`, stdin as a byte stream that can be closed or kept open; stdout as an ordered byte stream (binary-safe, no line or UTF-8 assumption); a distinct could-not-start error (ENOENT, EACCES) vs. sandbox unavailable; cancel with grace; forward verbs; shell-string tools kept for LLMs; schema snapshots; 0.2 refused cleanly"
    depends_on: [design]
    artifacts: [crates/sandcrab-protocol/src, docs/protocol.md]
    status: todo

  - id: guest-exec
    phase: implement
    agent: ada
    title: "crabd: argv exec with exact env (no shell, nothing inherited from crabd), rlimits set before exec, stdin stream, ordered stdout stream with backpressure, stderr tail or merged at the source, exit resolved after the last byte, guest-side timeout, tree kill (ask, grace, force) that also gets a grandchild which ignores TERM or left the process group; nothing of the command is left when the call returns"
    depends_on: [protocol-03]
    artifacts: [crates/sandcrab-guest/src/tools/process.rs, crates/sandcrab-guest/src/tools/exec.rs]
    status: todo

  - id: guest-forwards
    phase: implement
    agent: ada
    title: "crabd forwards: listen on guest 127.0.0.1:<port> for each configured forward and relay every connection out over a dedicated host connection (the reverse of tunnel.open); loopback only, fixed port list set at spawn, per-forward connection cap, fails closed when the far end is gone"
    depends_on: [protocol-03]
    artifacts: [crates/sandcrab-guest/src/forward.rs]
    status: todo

  - id: core-config
    phase: implement
    agent: ada
    title: "sandcrab-core config: `forwards` on SandboxConfig, exec-capable /tmp option, pids / nofile limits in ResourceOverrides, ad-hoc host-dir mounts (ro or rw) under configured allowed roots with guest path = the path the client named, no registry entry per run, same traversal and symlink guards; labels stored with the backend object so they survive a manager restart; list by label and creation time; destroy by label with a confirmed-empty answer"
    depends_on: [design]
    artifacts: [crates/sandcrab-core/src/sandbox.rs, crates/sandcrab-core/src/policy.rs, crates/sandcrab-core/src/workspace.rs]
    status: todo

  - id: core-forwards
    phase: implement
    agent: ada
    title: "sandcrab-core host side of forwards and streams: accept forward connections from the guest and hand each to a target resolver (the server passes them on to the client; the Rust SDK may dial a Unix socket itself); client support for process byte streams; FakeBackend coverage"
    depends_on: [protocol-03]
    artifacts: [crates/sandcrab-core/src/forward.rs, crates/sandcrab-core/src/client.rs]
    status: todo

  - id: docker-backend
    phase: implement
    agent: ada
    title: "Docker backend: forwards with network `none` (no bridge, no published port), exec /tmp option, new limits, ad-hoc same-path mounts, labels on containers, list and reap by label; e2e: a sandbox with no network reaches exactly its forwards and nothing else"
    depends_on: [core-config, core-forwards, guest-forwards]
    artifacts: [crates/sandcrab-backend-docker/src]
    status: todo

  - id: libkrun-backend
    phase: implement
    agent: ada
    title: "libkrun backend: forwards over vsock (helper config v-next, no TSI, no netstack), same options and limits, ad-hoc virtio-fs shares at the same path with fd-pinned roots, labels in the helper record; e2e on macOS and Linux KVM"
    depends_on: [core-config, core-forwards, guest-forwards]
    artifacts: [crates/sandcrab-backend-libkrun/src]
    status: todo

  - id: byo-image
    phase: implement
    agent: ada
    title: "Templates from an image the adopter already builds: a manifest that points at an existing OCI image (crabd injected, digest pinned host-locally like any template), on Docker and through the rootfs pipeline for libkrun; test with a third-party Node + git + python image"
    depends_on: [design]
    artifacts: [crates/sandcrab-core/src/template.rs, crates/sandcrab-rootfs/src, templates, docs/template-pins.md]
    status: todo

  - id: rust-sdk
    phase: implement
    agent: ada
    title: "sandcrab-sdk: process handle (stdout bytes, write, end, cancel with grace, exit that never errors), bounded exec (timeout, kill grace, output cap with kill or tail, stderr cap, abort, input and output streams), forwards, labels, list and destroy by label; Firecracker refuses forwards explicitly (no silent downgrade)"
    depends_on: [guest-exec, core-config, core-forwards]
    artifacts: [crates/sandcrab-sdk/src]
    status: todo

  - id: selftest
    phase: implement
    agent: ada
    title: "Sandbox self-test in the SDK: named lines run in a fresh sandbox of the chosen template and backend (no capabilities, no new privileges, no user namespace, loopback only, DNS / gateway / metadata refused, a forward reaches its target and nothing else, nothing readable outside the mounts, another sandbox unreachable). Each line passes only on a real refusal, never on a timeout"
    depends_on: [rust-sdk, docker-backend]
    artifacts: [crates/sandcrab-sdk/src/selftest.rs]
    status: todo

  - id: server
    phase: implement
    agent: ada
    title: "New crate sandcrab-server + `sandcrab server` CLI command: Unix socket only, no TCP listener and no token: access is a required list of allowed peer uids checked on every connection, with the socket's owner, group and mode (0600 default) as the second layer; refuses to start without that list or on a socket directory others can write; refuses any mount that contains its own socket; one explicitly chosen backend, the API from the design, forward connections relayed to the client, sandboxes that outlive a client connection (TTL and labels decide, never a disconnect), state reloaded after a server restart so a client can list and reap what it left, allowed mount roots and path map from config, capabilities and self-test calls, doctor checks, a systemd unit example"
    depends_on: [rust-sdk, selftest]
    artifacts: [crates/sandcrab-server, crates/sandcrab-cli/src, docs/hosting.md]
    status: todo

  - id: ts-sdk
    phase: implement
    agent: ada
    title: "TypeScript SDK package (Node 26, no native code): socket client, types generated from the exported JSON Schemas; a process handle returned at once (stdout as AsyncIterable<Uint8Array>, write, end, cancel(graceMs), exit that never rejects and tells `could not start` from `unavailable`); bounded exec with AbortSignal, Readable input, Writable output, caps; the client end of forwards (dials the loopback port or Unix socket it named); labels, list, destroy, capabilities, self-test; many sandboxes on one connection; unit tests against an in-process fake server"
    depends_on: [protocol-03]
    artifacts: [sdk/typescript]
    status: todo

  - id: ts-e2e
    phase: implement
    agent: ada
    title: "TypeScript e2e against a real server on Docker, written as a process-contract suite that mirrors the adopter's launcher invariants: exact env and argv through no shell; 1 MiB of mixed UTF-8 and CRLF arrives ordered and complete; stdin end vs. open; cancel kills a grandchild that ignores TERM, twice is fine; ENOENT is `could not start`; exec bound, abort, cap with kill and with tail, leftovers gone, input and output streams; a forward to a client TCP port and to a client Unix socket; destroy by label confirmed empty; orphans listed after a client restart and after a server restart; 16 concurrent sandboxes; exec latency into a warm sandbox measured. Plus the CI job for the SDK and the server in the release tarballs"
    depends_on: [server, ts-sdk, docker-backend]
    artifacts: [sdk/typescript/test, .github/workflows/ci.yml, scripts/package-release.sh]
    status: todo

  # -------------------------------------------------------------- verify
  - id: review
    phase: verify
    agent: nebula
    title: "QA + security review: the peer-uid allowlist holds even with a world-writable socket, the server socket cannot be mounted into a sandbox (no token: a process that can open the socket has full control), a client cannot mount outside the allowed roots or touch another client's sandbox, a forward reaches only what the client named, no network besides forwards, exact-env exec leaks nothing from crabd, streams bounded, nothing outlives a cancelled or finished command, no backend downgrade, self-test lines cannot pass on a timeout, fmt / clippy / unit / Docker e2e green"
    depends_on: [ts-e2e, libkrun-backend, byo-image]
    artifacts: [docs/reviews/sdk-milestone-review.md]
    status: todo

  - id: live-linux
    phase: verify
    agent: nova
    title: "Live on the Linux VPS (Docker, no KVM): server as a systemd service; a TypeScript client inside a hardened container that mounts only the server socket and a data volume; folders at the same path on both sides; a monorepo install + build + test through a forward to a proxy inside the client's container; kill, destroy by label, reap after restarting the client; self-test green"
    depends_on: [ts-e2e, byo-image]
    status: todo

  - id: live-mac
    phase: verify
    agent: nova
    title: "Live on the Mac (libkrun): the client as a host process beside the server (identity path map), a virtio-fs folder edited from the host mid-run, forwards over vsock, an agent CLI as a line-duplex process, self-test green"
    depends_on: [ts-e2e, libkrun-backend, byo-image]
    status: todo

  - id: adopter-pilot
    phase: verify
    agent: nova
    title: "Pilot in the adopter's repository (its branch, its flow): a Sandcrab-backed launcher passes the adopter's own launcher conformance suite, then its sandboxed check steps and one agent run go through it. The milestone is not done before this is green"
    depends_on: [live-linux, adopter-flow]
    status: todo

  # ------------------------------------------------------------ document
  - id: docs
    phase: document
    agent: rosetta
    title: "docs/server.md, docs/sdk-typescript.md, protocol.md 0.3, hosting.md (server per backend, socket and token setup, path map), bring-your-own-image guide, self-test reference, ROADMAP status, AGENTS.md crate map, README, CHANGELOG"
    depends_on: [review, live-linux, live-mac, adopter-pilot]
    artifacts: [docs/server.md, docs/sdk-typescript.md, docs/protocol.md, docs/hosting.md, docs/ROADMAP.md, AGENTS.md, README.md, CHANGELOG.md]
    status: todo
