# CI for the Rust workspace: fmt, clippy + unit tests on Linux x86_64 / Linux arm64 / macOS arm64,
# and the static musl `crabd` build. GitHub-hosted runners only (free for public repos).
#
# `cargo test` here runs the non-ignored tests only. The `#[ignore]`d e2e tests need Docker images,
# a static crabd, KVM or libkrun and belong in a separate e2e workflow.
name: CI

on:
  # No `paths-ignore`: some files under docs/ are compiled into the build (include_str!), and a
  # path-filtered workflow never reports its required checks on docs-only PRs. The `changes` job
  # decides instead, and `ci-ok` always reports.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Decides whether the Rust jobs need to run. Pure docs/markdown PRs skip them; everything else,
  # and every push / manual run, runs them.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail safe: if the diff cannot be computed, run everything.
          if ! files=$(git diff --name-only "$BASE_SHA" HEAD); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          rust=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Compiled into the build: include_str! in sandcrab-bench (results.rs, validity.rs).
              # Re-grep `include_str!\|include_bytes!` under crates/ when adding paths outside crates/.
              docs/bench/results/*) rust=true ;;
              docs/*|*.md) ;;
              *) rust=true ;;
            esac
          done <<< "$files"
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on GitHub-hosted runners; `rustup toolchain install` with no argument installs
      # what rust-toolchain.toml pins (stable + rustfmt + clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on GitHub-hosted runners; `rustup toolchain install` with no argument installs
      # what rust-toolchain.toml pins (stable + rustfmt + clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      # e2fsprogs (mke2fs, debugfs) and fakeroot: the rootfs / Firecracker workspace image tests and
      # the fake-VMM suite skip themselves without them, so install them to actually run those tests.
      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs fakeroot
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  crabd-musl:
    name: crabd static musl (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on GitHub-hosted runners; `rustup toolchain install` with no argument installs
      # what rust-toolchain.toml pins (stable + rustfmt + clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - name: Add musl target
        env:
          ARCH: ${{ matrix.arch }}
        run: rustup target add "$ARCH-unknown-linux-musl"
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: crabd-musl-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build static crabd
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/build-crabd.sh "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crabd-${{ matrix.arch }}-linux-musl
          path: |
            target/${{ matrix.arch }}-unknown-linux-musl/release/crabd
            target/${{ matrix.arch }}-unknown-linux-musl/release/crabd.sha256
          retention-days: 3
          if-no-files-found: error

  # branch protection: require only `ci-ok`.
  # Always reports; skipped jobs (docs-only PRs) count as success, failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    needs: [changes, fmt, check, crabd-musl]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check needed job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled) echo "::error::a required job ended with: $r"; exit 1 ;;
            esac
          done
