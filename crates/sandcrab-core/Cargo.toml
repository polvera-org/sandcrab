[package]
name = "sandcrab-core"
description = "Core runtime backend traits, persistent workspace model, templates, and sandbox lifecycle manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Expose the mock crabd test doubles (sandcrab_core::testing) to downstream tests.
test-util = []

[dependencies]
sandcrab-protocol.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["fs"] }
uuid.workspace = true
getrandom.workspace = true
# workspace archive (sync-back) unpacking
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile.workspace = true
# archive round-trip tests use the guest packer
sandcrab-guest = { path = "../sandcrab-guest" }

[lints]
workspace = true
