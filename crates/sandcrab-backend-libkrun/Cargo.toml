[package]
name = "sandcrab-backend-libkrun"
description = "Hardware-isolated libkrun microVM RuntimeBackend for Sandcrab (macOS Hypervisor.framework and Linux KVM, per-sandbox signed helper, live virtio-fs workspaces)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The `sandcrab-krun` helper lives at `src/bin/sandcrab-krun.rs` (auto-discovered bin target).
# libkrun is loaded at runtime with `libloading` from a pinned absolute path, so this crate
# builds and tests on any host without libkrun installed (design §3).

[dependencies]
sandcrab-core.workspace = true
sandcrab-protocol.workspace = true
sandcrab-rootfs.workspace = true
async-trait.workspace = true
libloading.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["fs", "process", "stdio"] }

# The helper SHA-256s ~33 MB of libkrun + libkrunfw on every spawn: use the ARMv8 SHA2
# instructions (sha2's `asm` backend) instead of the portable code (~95 ms → ~20 ms on M2).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
sandcrab-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

# Spawn → helper config → ctl.sock → init.* → tools → destroy against a fake `sandcrab-krun`
# (this test binary re-executes itself as the fake helper, so it needs its own `main`).
[[test]]
name = "fake_helper"
harness = false

# Same as `[workspace.lints]` except `unsafe_code` is `deny` instead of `forbid`, so the
# single FFI module (`src/ffi.rs`) can opt out with `#[allow(unsafe_code)]` (design §3).
# Keep the rest in sync with the root `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
