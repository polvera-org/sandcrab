[package]
name = "sandcrab-backend-libkrun"
description = "Hardware-isolated libkrun microVM RuntimeBackend for Sandcrab (macOS Hypervisor.framework and Linux KVM, per-sandbox signed helper, live virtio-fs workspaces)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The `sandcrab-krun` helper lives at `src/bin/sandcrab-krun.rs` (auto-discovered bin target).
# libkrun is loaded at runtime with `libloading` from a pinned absolute path, so this crate
# builds and tests on any host without libkrun installed (design §3).

[dependencies]
sandcrab-core.workspace = true
sandcrab-protocol.workspace = true
sandcrab-rootfs.workspace = true
async-trait.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["fs", "process", "stdio"] }

[dev-dependencies]
sandcrab-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

# Same as `[workspace.lints]` except `unsafe_code` is `deny` instead of `forbid`, so the
# single FFI module (`src/ffi.rs`) can opt out with `#[allow(unsafe_code)]` (design §3).
# Keep the rest in sync with the root `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
