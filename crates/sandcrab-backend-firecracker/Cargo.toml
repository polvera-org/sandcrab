[package]
name = "sandcrab-backend-firecracker"
description = "Firecracker microVM RuntimeBackend for Sandcrab (rootfs pipeline + pinned guest artifacts; VMM backend lands in step fc-backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[[bin]]
name = "sandcrab-rootfs"
path = "src/bin/sandcrab-rootfs.rs"

[dependencies]
rustix = { workspace = true, features = ["fs", "process"] }
tracing.workspace = true
sandcrab-core.workspace = true
sandcrab-protocol.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
sandcrab-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
