[package]
name = "sandcrab-sdk"
description = "Ergonomic async Rust SDK for managing Sandcrab ephemeral sandboxes and persistent workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["docker"]
# DockerDev backend (shared kernel; local dev / CI only, requires explicit opt-in).
docker = ["dep:sandcrab-backend-docker"]

[dependencies]
sandcrab-core.workspace = true
sandcrab-protocol.workspace = true
sandcrab-backend-docker = { workspace = true, optional = true }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
sandcrab-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
