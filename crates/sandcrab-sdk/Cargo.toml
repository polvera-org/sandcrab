[package]
name = "sandcrab-sdk"
description = "Ergonomic async Rust SDK for managing Sandcrab ephemeral sandboxes and persistent workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["docker"]
# Docker backend (hardened containers, shared kernel; officially supported).
docker = ["dep:sandcrab-backend-docker"]
# Firecracker microVM backend (hardware isolated; Linux x86_64 + /dev/kvm). Off by default.
# The dependency only exists on Linux: elsewhere the feature compiles to nothing.
firecracker = ["dep:sandcrab-backend-firecracker"]
# libkrun microVM backend (hardware isolated; Apple Silicon macOS Hypervisor.framework and Linux
# KVM). Off by default. libkrun is dlopened at runtime by the signed helper, so enabling it adds
# no link-time dependency. The dependency only exists on macOS aarch64 and Linux: elsewhere the
# feature compiles to nothing (`--backend libkrun` is then a "not compiled in" error).
libkrun = ["dep:sandcrab-backend-libkrun"]

[dependencies]
sandcrab-core.workspace = true
sandcrab-protocol.workspace = true
sandcrab-backend-docker = { workspace = true, optional = true }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sandcrab-backend-firecracker = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
sandcrab-backend-libkrun = { workspace = true, optional = true }

[dev-dependencies]
sandcrab-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
