[package]
name = "sandcrab-guest"
description = "crabd: static Rust guest daemon executing computer-use tools inside Sandcrab sandboxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "sandcrab_guest"
path = "src/lib.rs"

[[bin]]
name = "crabd"
path = "src/main.rs"

[dependencies]
sandcrab-protocol.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Not `tokio.workspace` (which enables "full"): crabd ships as a small static binary, so it
# opts into exactly the runtime pieces it uses. `process` and `fs` are for the tool modules.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "process",
    "fs",
] }
# guest-fs deps
similar = "2"
base64 = "0.22"
tempfile = "3"
# guest-exec deps
# Safe killpg for process-group teardown; PTY allocation (+ setsid/controlling tty) for process_start.
rustix = { version = "1", features = ["process"] }
pty-process = { version = "0.5", features = ["async"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
